name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on version tags e.g. v1.0.0

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Best compatibility for PyInstaller

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev gcc libcairo2-dev pkg-config python3-dev gir1.2-gtk-3.0 gir1.2-appindicator3-0.1 libayatana-appindicator3-1

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: pyinstaller callosum.spec

      - name: Rename Output (Windows)
        if: runner.os == 'Windows'
        run: Move-Item -Path dist\callosum.exe -Destination dist\callosum-windows-amd64.exe

      - name: Rename Output (Linux)
        if: runner.os == 'Linux'
        run: mv dist/callosum dist/callosum-linux-amd64

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: callosum-${{ runner.os }}
          path: |
            dist/callosum-windows-amd64.exe
            dist/callosum-linux-amd64

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/callosum-windows-amd64.exe
            dist/callosum-linux-amd64
          generate_release_notes: true
